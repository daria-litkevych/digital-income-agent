name: Digital Income Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7,10,13,16,19 * * *"

permissions:
  contents: write

concurrency:
  group: digital-income-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect research signals
        run: python -m agent.main

      - name: Run Project Manager cycle
        run: python -m agent.project_manager

      - name: Sync dashboard data snapshot
        run: |
          mkdir -p dashboard/data
          cp data/project_plan.json data/state.json data/market_research.json dashboard/data/

      - name: Save state, report and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/project_plan.json data/market_research.json dashboard/data/project_plan.json dashboard/data/state.json dashboard/data/market_research.json reports/latest.md reports/market-research.md reports/project-manager.md
          if ! git diff --cached --quiet; then
            git commit -m "Update research state and report"
            git push
          fi
